name: Sync to Home Assistant Core Fork

on:
  push:
    tags:
      - "core-v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci-base.yml

  sync:
    name: Sync to Core Fork
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract tag name
        id: tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#core-}
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout core fork
        uses: actions/checkout@v7
        with:
          repository: energy-tracker/core
          token: ${{ secrets.CORE_SYNC_TOKEN }}
          path: core-fork
          fetch-depth: 0

      - name: Configure git
        working-directory: core-fork
        env:
          GIT_AUTHOR_NAME: ${{ secrets.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      - name: Sync fork with upstream
        working-directory: core-fork
        run: |
          git remote add upstream https://github.com/home-assistant/core.git || true
          git fetch upstream dev
          git checkout dev
          git merge --ff-only upstream/dev
          git push origin dev

      - name: Create new export branch from dev
        working-directory: core-fork
        env:
          VERSION: ${{ steps.tag.outputs.VERSION }}
        run: |
          BRANCH="energy-tracker-$VERSION"
          EXISTING=$(git ls-remote --heads origin "refs/heads/$BRANCH")
          if [ -n "$EXISTING" ]; then
            echo "::error::Export branch $BRANCH already exists; refusing to overwrite it."
            exit 1
          fi
          git checkout -b "$BRANCH" origin/dev

      - name: Set up Python for Core
        uses: actions/setup-python@v7
        with:
          python-version-file: core-fork/.python-version

      - name: Install Core test dependencies
        working-directory: core-fork
        run: |
          python -m venv venv
          venv/bin/python -m pip install uv
          venv/bin/python ../scripts/install_core_test_dependencies.py .

      - name: Export integration and tests for Core
        run: core-fork/venv/bin/python scripts/export_to_core.py core-fork

      - name: Validate exported integration before publishing
        working-directory: core-fork
        run: |
          . venv/bin/activate
          python -m script.translations develop --integration energy_tracker
          ruff check homeassistant/components/energy_tracker tests/components/energy_tracker
          ruff format --check homeassistant/components/energy_tracker tests/components/energy_tracker
          pytest tests/components/energy_tracker -q
          python -m script.hassfest --action generate
          python -m script.gen_requirements_all

      - name: Create commit
        working-directory: core-fork
        env:
          VERSION: ${{ steps.tag.outputs.VERSION }}
        run: |
          git add -A
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Add Energy Tracker integration $VERSION"

      - name: Push branch
        working-directory: core-fork
        env:
          VERSION: ${{ steps.tag.outputs.VERSION }}
        run: |
          git push origin "energy-tracker-$VERSION"
          echo "✅ Branch energy-tracker-$VERSION pushed to energy-tracker/core"
