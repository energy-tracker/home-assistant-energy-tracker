name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci-base.yml

  hacs:
    name: HACS Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  release:
    name: Create Release
    permissions:
      contents: write
    needs:
      - ci
      - hacs
      - hassfest
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract tag name
        id: tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Validate version matches tag
        env:
          TAG_NAME: ${{ steps.tag.outputs.TAG_NAME }}
        run: |
          MANIFEST_VERSION=$(jq -r '.version' custom_components/energy_tracker/manifest.json)
          TAG_VERSION=${TAG_NAME#v}
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch: manifest.json has '$MANIFEST_VERSION', tag is '$TAG_VERSION'"
            exit 1
          fi
          echo "✅ Version match: $MANIFEST_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: Release ${{ steps.tag.outputs.TAG_NAME }}
          body: |
            Install via [HACS](https://hacs.xyz/) or manually copy `custom_components/energy_tracker/` to your Home Assistant config.

            [Setup and usage](https://github.com/energy-tracker/home-assistant-energy-tracker#readme)
          draft: false
          prerelease: false
          generate_release_notes: true
