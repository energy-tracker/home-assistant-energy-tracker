name: CI Base

on:
  workflow_call:
    outputs:
      python-version:
        description: "Python version from Home Assistant Core"
        value: ${{ jobs.setup.outputs.python-version }}

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    outputs:
      python-version: ${{ steps.python-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read tested Home Assistant version
        id: homeassistant
        run: |
          VERSION=$(sed -n 's/^homeassistant==//p' requirements-dev.lock)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout tested Home Assistant release
        uses: actions/checkout@v7
        with:
          repository: home-assistant/core
          ref: ${{ steps.homeassistant.outputs.version }}
          path: ha-core
          sparse-checkout: .python-version
          sparse-checkout-cone-mode: false

      - name: Get Python version from Core
        id: python-version
        run: echo "version=$(cat ha-core/.python-version)" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c requirements-dev.lock

      - name: Run tests with coverage
        run: pytest --cov=custom_components.energy_tracker --cov-report=term --cov-report=xml -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.setup.outputs.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c requirements-dev.lock

      - name: Run ruff
        run: |
          ruff format --config ruff.base.toml --check custom_components tests
          ruff check --config ruff.base.toml custom_components tests
          ruff format --config ruff.tooling.toml --check scripts
          ruff check --config ruff.tooling.toml scripts

      - name: Run mypy
        run: mypy custom_components

      - name: Check translations
        run: python scripts/lint_translations.py

      - name: Check JSON formatting
        run: |
          find custom_components/energy_tracker -name "*.json" | while IFS= read -r file; do
            python3 -c "import json,sys; d=json.load(open('$file')); formatted=json.dumps(d,ensure_ascii=False,indent=2)+'\n'; current=open('$file').read(); sys.exit(0 if formatted==current else 1)" || (echo "❌ $file is not formatted correctly. Run 'make format' locally." && exit 1)
          done
